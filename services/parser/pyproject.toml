[project]
name = "esg-parser"
version = "0.0.0"
description = "파일을 읽어 구조화된 JSON 으로 돌려주는 일만 한다. DB 접근·업무 로직·상태가 없다."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    # 분해기(docparse/)가 쓰는 둘. 판은 esg-lab py/uv.lock(커밋 2e2c2c4)의 것과 같다: 골든이 그 판으로 잰 것이다.
    "pypdfium2==5.14.0",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",  # FastAPI 의 TestClient 가 쓴다
    # 린트·포맷·타입 검사. 판은 apps/api-py 와 같다(올릴 때 둘을 같이 올린다).
    "ruff==0.16.10",
    "pyright==1.1.414",
]

[tool.uv]
package = false  # 설치할 패키지가 아니라 app.py 하나를 돌리는 서비스다
# jsonschema 에 딸려 오는 것도 esg-lab py/uv.lock(커밋 2e2c2c4)의 판에 묶는다.
constraint-dependencies = [
    "attrs==26.1.0",
    "jsonschema-specifications==2025.9.1",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test_app.py", "tests"]
markers = [
    "reports: 공개 보고서 PDF(PARSER_REPORTS_DIR)와 정답 표(PARSER_GOLD_DIR)가 있어야 도는 테스트. 없으면 건너뛰지 않고 실패한다",
]
addopts = "-m 'not reports'"

# ── 린트·포맷 ── 규칙 묶음은 apps/api-py 와 같다.   확인: uv run ruff check . && uv run ruff format --check .
# ★ docparse/ 는 esg-app 의 정본이고(밴드 PX, 2026-10-16) 다른 코드와 같은 포맷·린트·타입 검사를 받는다.
#   분해 산출이 esg-lab 2e2c2c4 와 같음은 줄 글자가 아니라 검증 트랙의 대조(PB1)가 지킨다.
#   사본이던 때의 예외(포맷 제외, 린트 규칙 열둘 끔, 타입 검사 밖)는 밴드 PX2 ⑨ 에서 걷었다. 남은 정본의 예외는 아래
#   per-file 의 docparse 줄 하나와 줄 단위 `# pyright: ignore[…]` 넷(까닭은 그 줄에)이다.
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "DJ", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 한국어 주석·문장의 글자를 '헷갈리는 글자'로 본다
]

[tool.ruff.lint.per-file-ignores]
# 테스트: assert, 테스트가 띄우는 자기 CLI(subprocess). api-py 의 테스트 예외와 같은 줄.
"tests/**" = ["S101", "S105", "S106", "S603", "S608", "E501"]
"test_app.py" = ["S101", "S105", "S106", "S603", "S608"]
"scripts/**" = ["S603", "S607", "E501"]
# E501(tests/·scripts/): 포맷터가 접지 못하는 긴 문자열·주석이 남는다(tests 41줄, scripts 10줄. 밴드 PY8a 가 잰 수).
# 손으로 접지 않았다. app.py·test_app.py 에는 E501 이 걸려 있다.
# S324: PDF 표준 보안 처리기(암호화된 PDF 의 열쇠 유도)가 MD5 를 쓴다. 테스트용 PDF 를 짓는 데만 쓴다.
"tests/pdfbuild.py" = ["S324"]
# 정본의 예외: tables_lines.py 의 긴 주석 한 줄이 공개 보고서 회사 이름을 담는다. 그 줄들은 사용자 결정 대기라 고치지
# 않는다(밴드 PX2 발주서 §1 「0줄」). 줄 끝에 noqa 를 다는 것도 그 줄을 고치는 것이라 파일 단위로 둔다. 결정이 나면 걷는다.
"docparse/tables_lines.py" = ["E501"]

# ── 타입 검사 ── 타입 표기가 없는 코드라 strict 가 아니다(basic).   확인: uv run pyright
# 범위는 app.py·test_app.py·scripts/·docparse/ 다(basic 오류 0. docparse/ 는 밴드 PX2 ⑨ 에서 넣었다).
# tests/ 는 basic 에서 오류가 34건(파일 7개. 밴드 PY8a 가 잰 수, 2026-10-08)이라 뺐다:
# 고치지 않았다. 대부분 pypdfium2·테스트 도우미의 「None 일 수 있는 값」 표기다.
[tool.pyright]
include = ["app.py", "test_app.py", "scripts", "docparse"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
