# 로컬의 SQS 흉내(ElasticMQ, compose 의 queue)의 설정. 컨테이너 안의 자리는 /opt/elasticmq.conf 다.
# 큐를 여기서 미리 만든다. 앱(Celery)은 큐를 만들지 않는다(esgapi/config/celery.py 의 predefined_queues).
include classpath("application.conf")

# 큐 주소에 들어가는 이름. compose 의 서비스 이름과 같아야 한다(http://queue:9324/000000000000/esg-jobs).
node-address {
  protocol = http
  host = queue
  port = 9324
  context-path = ""
}

queues {
  esg-jobs {
    # ★ 재전달의 시각은 이 값이 정한다(Celery 의 visibility_timeout 옵션은 미리 만든 큐에서 쓰이지 않는다).
    #   360 은 시간의 차례(밴드 PX)에서 정했다. 일감의 임대(JOB_LEASE_SECONDS 기본 330)보다 커야 한다: 재전달이 임대가 끝난 뒤에 오게.
    #   esgapi/config/env.py 의 CELERY_VISIBILITY_TIMEOUT_SECONDS 기본값과 같아야 한다(config/tests/test_env.py 가 견준다).
    defaultVisibilityTimeout = 360 seconds
  }
}
